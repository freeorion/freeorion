name: "Ubuntu"

on:
  workflow_call:

jobs:
  ubuntu:
    name: "${{ matrix.os }} with ${{ matrix.compiler }} (parsers: ${{ matrix.build-parsers }}, asan: ${{ matrix.asan }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04]
        compiler: [gcc, clang]
        client-godot: ["3"]
        build-parsers: ["ON"]
        asan: [false]
        include:
          - os: ubuntu-24.04
            compiler: gcc
            client-godot: "3"
            build-parsers: "ON"
            asan: true
          - os: ubuntu-24.04
            compiler: gcc
            client-godot: "3"
            build-parsers: "OFF"
            asan: false
    env:
      CACHE_NAME: linux
      BUILD_TYPE: ${{ matrix.asan && 'RelWithDebInfo' || 'Release' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/cache@v6
        id: build-ubuntu-install-cache-id
        with:
          path: ${{ runner.temp }}/cache-build-linux-install
          key: build-${{ matrix.os }}-install-cache-key-v1.0
      - uses: airvzxf/cache-anything-new-action@v1.0.1
        with:
          script: '${{ matrix.os }}-install-build.sh'
          is_cached: ${{ steps.build-ubuntu-install-cache-id.outputs.cache-hit }}
          cache: ${{ runner.temp }}/cache-build-linux-install
          snapshot: '/'
          exclude: '/boot /data /dev /mnt /proc /run /sys'
      - name: Prepare ccache timestamp
        id: build-ubuntu-ccache-timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          file(APPEND "$ENV{GITHUB_OUTPUT}" "timestamp=${current_date}")
      - name: Cache files with ccache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: build-${{ matrix.os }}-${{ matrix.compiler }}-ccache-${{ steps.build-ubuntu-ccache-timestamp.outputs.timestamp }}
          restore-keys: |
            build-${{ matrix.os }}-${{ matrix.compiler }}-ccache-
      - name: Configure ccache
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          ccache --set-config=sloppiness=file_macro,time_macros
      - name: Show ccache statistics before build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          ccache --show-stats || true
      - name: Build directory
        run: mkdir build
      - name: Configure for gcc
        if: ${{ matrix.compiler == 'gcc' && ! matrix.asan }}
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CC: ${{ matrix.os == 'ubuntu-24.04' && 'gcc-14' || 'gcc-15' }}
          CXX: ${{ matrix.os == 'ubuntu-24.04' && 'g++-14' || 'g++-15' }}
        run: |
          cd build
          cmake -DBUILD_TESTING=ON -DBUILD_CLIENT_GG=ON -DBUILD_CLIENT_GODOT=${{ matrix.client-godot }} -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_PARSERS=${{ matrix.build-parsers }} ..
      - name: Configure for clang
        if: ${{ matrix.compiler == 'clang' }}
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CXXFLAGS: '-I/usr/include/SDL2 -I/usr/include/x86_64-linux-gnu/SDL2/ -I/usr/include/x86_64-linux-gnu/'
          CFLAGS: '-I/usr/include/SDL2 -I/usr/include/x86_64-linux-gnu/SDL2/ -I/usr/include/x86_64-linux-gnu/'
          CC: ${{ (matrix.os == 'ubuntu-24.04' && 'clang-18' || 'clang-22') }}
          CXX: ${{ (matrix.os == 'ubuntu-24.04' && 'clang++-18' || 'clang++-22') }}
        run: |
          cd build
          cmake -DBUILD_TESTING=ON -DBUILD_CLIENT_GG=ON -DBUILD_CLIENT_GODOT=${{ matrix.client-godot }} -DCMAKE_BUILD_TYPE=$BUILD_TYPE ..
      # try to catch possible issues with memory access
      - name: Configure for gcc with address sanitizer
        if: ${{ matrix.compiler == 'gcc' && matrix.asan }}
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CXXFLAGS: '-fsanitize=address -g'
          CFLAGS: '-fsanitize=address -g'
          CC: gcc-14
          CXX: g++-14
          LDFLAGS: '-fsanitize=address'
        run: |
          cd build
          cmake -DBUILD_TESTING=ON -DBUILD_CLIENT_GG=ON -DBUILD_CLIENT_GODOT=${{ matrix.client-godot }} -DCMAKE_BUILD_TYPE=$BUILD_TYPE ..
      - name: Build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: |
          cd build
          cmake --build .
      - name: Show ccache statistics after build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          ccache --show-stats || true
      - name: Run C++ unit tests
        env:
          FO_TEST_HOSTLESS_GAMES: 1
          ASAN_OPTIONS: ${{ matrix.asan && 'detect_leaks=0:abort_on_error=1' || ''}}
        run: |
          cd build
          cmake --build . --config $BUILD_TYPE --target unittest
      - name: Run Godot unit tests
        if: matrix.client-godot == '3' && matrix.build-parsers == 'ON'
        env:
          ASAN_OPTIONS: ${{ matrix.asan && 'detect_leaks=0:abort_on_error=1' || ''}}
          LD_PRELOAD: ${{ matrix.asan && '/usr/lib/gcc/x86_64-linux-gnu/13/libasan.so' || '' }}
        run: |
          cp `which godot3-server` build/
          ./build/godot3-server --disable-render-loop --verbose -s --path godot addons/gut/gut_cmdln.gd -gdir=res://test/ -ginclude_subdirs -gexit
